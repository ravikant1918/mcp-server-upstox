[project]
name = "upstock-mcp"
version = "0.1.0"
description = "MCP Server for Upstox integration"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "upstox-python-sdk>=2.0.0",
    "pandas>=2.2.2",
    "pandas-ta==0.4.71b0",
    "numpy>=2.2.6",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "fastmcp>=2.14.0",
    "httpx>=0.27.1"
]

[project.scripts]
upstox-mcp = "upstock_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["upstock_mcp"]
