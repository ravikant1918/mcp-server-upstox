[project]
name = "upstock-mcp"
version = "2.0.0"
description = "MCP Server for Upstox integration"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.26.0,<1.27.0",
    "fastmcp==2.14.4",
    "fastapi>=0.128.0",
    "uvicorn>=0.35.0",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "upstox-python-sdk>=2.19.0",
    "pandas>=2.2.0",
    "pandas-ta==0.4.71b0",
    "numpy>=2.2.6",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "uvloop>=0.22.1; sys_platform != 'win32'"
]

[project.scripts]
upstox-mcp = "upstock_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["upstock_mcp"]
